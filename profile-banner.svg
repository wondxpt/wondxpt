<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Abbas Shiri — Full-stack developer</title>
  <desc id="desc">A refined dark navy and blue banner about building useful software across web, mobile, and SaaS products.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset=".52" stop-color="#172554"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="30" r="170" fill="#6366F1" opacity=".2" filter="url(#glow)"/>
  <circle cx="1100" cy="280" r="190" fill="#22D3EE" opacity=".12" filter="url(#glow)"/>
  <path d="M720 0C840 62 828 170 950 194S1093 166 1200 246" fill="none" stroke="url(#line)" stroke-opacity=".6" stroke-width="1.4"/>
  <path d="M740 0C860 62 848 170 970 194S1113 166 1200 246" fill="none" stroke="url(#line)" stroke-opacity=".2" stroke-width="12"/>
  <g transform="translate(84 64)">
