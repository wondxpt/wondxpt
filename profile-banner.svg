    <path d="M17 13 9 23l8 10M29 13l8 10-8 10M26 10l-6 26" fill="none" stroke="#0B1020" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="15" fill="#A5F3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.4">SOFTWARE ENGINEERING</text>
    <text x="62" y="43" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">ABBAS SHIRI</text>
  </g>
  <text x="84" y="173" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="760" letter-spacing="-1">Building useful software,</text>
  <text x="84" y="217" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="760" letter-spacing="-1">from idea to production.</text>
  <text x="86" y="260" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Web &amp; mobile products  ·  SaaS platforms  ·  Thoughtful user experiences</text>
  <g transform="translate(880 88)">
